<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria | Polícia Civil RJ — Revoada RJ</title>
    <link rel="icon" href="assets/img/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* ===== FILTROS ===== */
        .galeria-filtros {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 30px;
            justify-content: center;
        }

        .filtro-btn {
            background: transparent;
            border: 1px solid var(--borda);
            color: var(--texto);
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            transition: .3s;
            font-weight: 500;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        .filtro-btn:hover,
        .filtro-btn.ativo {
            background: var(--dourado);
            color: #000;
            border-color: var(--dourado);
        }

        /* ===== GRID ===== */
        .galeria-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 18px;
        }

        .galeria-item {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            aspect-ratio: 4/3;
            border: 2px solid var(--borda);
            transition: .4s;
            background: #000;
        }

        .galeria-item:hover {
            border-color: var(--dourado);
            transform: scale(1.03);
            box-shadow: 0 15px 35px rgba(201, 162, 39, .3);
        }

        .galeria-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: .6s;
        }

        .galeria-item:hover img {
            transform: scale(1.1);
        }

        .galeria-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, .95) 0%, transparent 60%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
            opacity: 0;
            transition: .4s;
        }

        .galeria-item:hover .galeria-overlay {
            opacity: 1;
        }

        .galeria-overlay h4 {
            color: var(--dourado);
            font-size: 18px;
            margin-bottom: 5px;
        }

        .galeria-overlay span {
            color: #ccc;
            font-size: 13px;
        }

        /* Vazio */
        .galeria-vazio {
            grid-column: 1/-1;
            text-align: center;
            padding: 80px 20px;
            color: var(--texto-muted);
        }

        .galeria-vazio i {
            font-size: 56px;
            color: var(--dourado);
            opacity: .4;
            margin-bottom: 20px;
            display: block;
        }

        /* ===== LIGHTBOX ===== */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .95);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .lightbox.open {
            display: flex;
            animation: fadeIn .3s;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 85vh;
            border: 3px solid var(--dourado);
            border-radius: 10px;
        }

        .lightbox-close {
            position: absolute;
            top: 25px;
            right: 35px;
            color: var(--dourado);
            font-size: 34px;
            cursor: pointer;
            background: none;
            border: none;
            transition: .3s;
        }

        .lightbox-close:hover {
            transform: rotate(90deg);
            color: var(--vermelho);
        }

        .lightbox-caption {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--dourado);
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            max-width: 90%;
        }
    </style>
</head>

<body>

    <header>
        <div class="header-container">
            <a href="index.html" class="logo">
                <img src="assets/img/logo.png" alt="Logo PC-RJ">
                <span>POLÍCIA CIVIL — RJ</span>
            </a>
            <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu">
                <i class="fa-solid fa-bars"></i>
            </button>
            <nav>
                <ul id="navList">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="sobre.html">Sobre</a></li>
                    <li><a href="cargos.html">Cargos</a></li>
                    <li><a href="concursos.html">Concursos</a></li>
                    <li><a href="galeria.html">Galeria</a></li>
                    <li><a href="utilidades.html">Utilidades</a></li>
                    <li><a href="contato.html">Contato</a></li>
                    <li class="nav-actions">
                        <a href="painel.html" class="btn-login">
                            <i class="fa-solid fa-lock"></i> Área Restrita
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <section>
        <h2>Galeria de Operações</h2>
        <p style="text-align:center; margin-bottom:30px;">Registros das principais operações, formaturas e ações da
            Polícia Civil de Revoada RJ.</p>

        <!-- FILTROS -->
        <div class="galeria-filtros" id="galeriaFiltros">
            <button class="filtro-btn ativo" data-filtro="todas">
                <i class="fa-solid fa-images"></i> Todas
            </button>
            <button class="filtro-btn" data-filtro="operacoes">
                <i class="fa-solid fa-crosshairs"></i> Operações
            </button>
            <button class="filtro-btn" data-filtro="formaturas">
                <i class="fa-solid fa-graduation-cap"></i> Formaturas
            </button>
            <button class="filtro-btn" data-filtro="core">
                <i class="fa-solid fa-shield-halved"></i> CORE
            </button>
            <button class="filtro-btn" data-filtro="saer">
                <i class="fa-solid fa-helicopter"></i> SAER
            </button>
            <button class="filtro-btn" data-filtro="gem">
                <i class="fa-solid fa-motorcycle"></i> GEM
            </button>
            <button class="filtro-btn" data-filtro="cgpc">
                <i class="fa-solid fa-clipboard-check"></i> CGPC
            </button>
        </div>

        <!-- GRID -->
        <div class="galeria-grid" id="galeriaGrid"></div>
    </section>

    <!-- LIGHTBOX -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightboxClose" aria-label="Fechar">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <img src="" alt="" id="lightboxImg">
        <div class="lightbox-caption" id="lightboxCaption"></div>
    </div>

    <footer>
        <p>© 2025 Polícia Civil RJ — Revoada RJ | Todos os direitos reservados</p>
    </footer>

    <script src="js/main.js"></script>

    <script type="module">
        /* ============================================================
           SUPABASE
           ============================================================ */
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const supabase = createClient(
            'https://tiokyomdsfgdloyxiazc.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRpb2t5b21kc2ZnZGxveXhpYXpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4OTMyMDksImV4cCI6MjEwNjQ2OTIwOX0.HJwTC3sgDfofEHaidpM2H3O7dGDnpcUdGttM5dTsLR8'
        );

        /* ============================================================
           ESTADO
           ============================================================ */
        let FOTOS = [];
        let filtroAtual = 'todas';

        /* ============================================================
           CARREGAR
           ============================================================ */
        async function carregarGaleria() {
            try {
                const { data, error } = await supabase
                    .from('galeria')
                    .select('*')
                    .order('ordem', { ascending: true });

                if (error) throw error;

                FOTOS = data || [];
            } catch (err) {
                console.error('Erro ao carregar galeria:', err);
                FOTOS = [];
            }
        }

        /* ============================================================
           RENDER
           ============================================================ */
        function renderGaleria() {
            const grid = document.getElementById('galeriaGrid');
            if (!grid) return;

            const filtradas = filtroAtual === 'todas'
                ? FOTOS
                : FOTOS.filter(f => f.categoria === filtroAtual);

            const ordenadas = [...filtradas].sort((a, b) => (a.ordem || 0) - (b.ordem || 0));

            if (ordenadas.length === 0) {
                grid.innerHTML = `
          <div class="galeria-vazio">
            <i class="fa-solid fa-camera-retro"></i>
            <p>Nenhuma foto nesta categoria.</p>
          </div>
        `;
                return;
            }

            grid.innerHTML = ordenadas.map(f => `
        <div class="galeria-item" data-id="${f.id}">
          <img src="${f.imagem_url}" alt="${f.titulo}" loading="lazy" onerror="this.src='assets/img/logo.png'; this.style.opacity='.3';">
          <div class="galeria-overlay">
            <h4>${f.titulo}</h4>
            <span>${f.descricao || ''}</span>
          </div>
        </div>
      `).join('');

            grid.querySelectorAll('.galeria-item').forEach(item => {
                item.addEventListener('click', () => abrirLightbox(item.dataset.id));
            });
        }

        /* ============================================================
           LIGHTBOX
           ============================================================ */
        function abrirLightbox(id) {
            const foto = FOTOS.find(f => f.id === id);
            if (!foto) return;

            document.getElementById('lightboxImg').src = foto.imagem_url;
            document.getElementById('lightboxCaption').textContent = foto.titulo + (foto.descricao ? ' — ' + foto.descricao : '');
            document.getElementById('lightbox').classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function fecharLightbox() {
            document.getElementById('lightbox').classList.remove('open');
            document.body.style.overflow = '';
        }

        document.getElementById('lightboxClose')?.addEventListener('click', fecharLightbox);
        document.getElementById('lightbox')?.addEventListener('click', (e) => {
            if (e.target.id === 'lightbox') fecharLightbox();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') fecharLightbox();
        });

        /* ============================================================
           FILTROS
           ============================================================ */
        document.querySelectorAll('.filtro-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('ativo'));
                btn.classList.add('ativo');
                filtroAtual = btn.dataset.filtro;
                renderGaleria();
            });
        });

        /* ============================================================
           INIT
           ============================================================ */
        (async () => {
            await carregarGaleria();
            renderGaleria();
        })();
    </script>
</body>

</html>
